<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Island Air Rally — a flight game over the Coral Archipelago</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a1622; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #eef4f8; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
  .hidden { display: none !important; }
  .hud-box { position: absolute; background: rgba(10, 22, 34, 0.62); border: 1px solid rgba(238,244,248,.25); border-radius: 8px; padding: 8px 12px; }
  #hud-top-left { top: 12px; left: 12px; font-size: 20px; font-weight: 700; line-height: 1.5; letter-spacing: .04em; }
  #hud-top-left .dim { color: #9fb4c4; font-weight: 600; font-size: 15px; }
  #hud-top-right { top: 12px; right: 12px; text-align: right; font-size: 17px; font-weight: 700; line-height: 1.5; }
  #hud-objective { top: 12px; left: 50%; transform: translateX(-50%); font-size: 17px; font-weight: 700; white-space: nowrap; }
  #hud-message { top: 64px; left: 50%; transform: translateX(-50%); font-size: 18px; font-weight: 700; color: #ffc93c; white-space: nowrap; background: none; border: none; }
  #hud-bottom-left { left: 12px; bottom: 12px; font-size: 14px; line-height: 1.7; }
  #hud-bottom-right { right: 12px; bottom: 12px; font-size: 13px; color: #9fb4c4; text-align: right; line-height: 1.6; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .bar-label { width: 74px; font-size: 12px; color: #9fb4c4; font-weight: 700; }
  .bar { display: inline-block; width: 150px; height: 10px; background: rgba(238,244,248,.18); border-radius: 5px; overflow: hidden; }
  .bar > * { display: block; height: 100%; border-radius: 5px; }
  #hud-throttle-fill { background: #4fc3f7; width: 0%; }
  #hud-fuel-fill { background: #37d67a; width: 100%; }
  #hud-damage-fill { background: #ff5a4e; width: 0%; }
  #instruments { position: absolute; left: 12px; bottom: 118px; background: rgba(10, 22, 34, 0.62); border: 1px solid rgba(238,244,248,.25); border-radius: 8px; }
  #panel { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 620px; max-width: 92vw; background: rgba(10, 22, 34, 0.86); border: 1px solid rgba(238,244,248,.3); border-radius: 12px; padding: 28px 34px; text-align: center; }
  #panel-title { margin: 0 0 10px; font-size: 40px; font-weight: 800; letter-spacing: .02em; }
  #panel-lines p { margin: 6px 0; font-size: 18px; color: #c8d8e2; line-height: 1.5; }
  #panel-prompt { margin: 18px 0 0; font-size: 19px; font-weight: 700; color: #ffc93c; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game" aria-label="Island Air Rally: fly the rings over the Coral Archipelago, then land on runway 09"></canvas>
<div id="hud">
  <div id="hud-top-left" class="hud-box">
    <div id="hud-alt">ALT — ft</div>
    <div id="hud-speed">SPD — kt</div>
    <div id="hud-heading">HDG —°</div>
  </div>
  <div id="hud-objective" class="hud-box">Island Air Rally — Coral Archipelago</div>
  <div id="hud-message"></div>
  <div id="hud-top-right" class="hud-box">
    <div id="hud-score">SCORE 0</div>
    <div id="hud-rings">RINGS 0/6</div>
    <div id="hud-time">0:00</div>
  </div>
  <canvas id="instruments" width="440" height="140" aria-hidden="true"></canvas>
  <div id="hud-bottom-left" class="hud-box">
    <div class="bar-row"><span class="bar-label">THROTTLE</span><span class="bar"><span id="hud-throttle-fill" style="display:block"></span></span></div>
    <div class="bar-row"><span class="bar-label" id="hud-fuel-value">FUEL 100%</span><span class="bar"><span id="hud-fuel-fill" style="display:block"></span></span></div>
    <div class="bar-row"><span class="bar-label">DAMAGE</span><span class="bar"><span id="hud-damage-fill" style="display:block"></span></span></div>
    <div id="hud-camera">CAM CHASE [C]</div>
  </div>
  <div id="hud-bottom-right" class="hud-box">
    W/S or ↑/↓ pitch &nbsp;·&nbsp; A/D or ←/→ bank<br>
    Shift / Ctrl throttle &nbsp;·&nbsp; mouse steers<br>
    C camera &nbsp;·&nbsp; P pause &nbsp;·&nbsp; M sound &nbsp;·&nbsp; R restart
  </div>
  <div id="panel" class="hidden">
    <h1 id="panel-title">Island Air Rally</h1>
    <div id="panel-lines"></div>
    <p id="panel-prompt"></p>
  </div>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
